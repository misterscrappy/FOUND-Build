name: Build FOUND Complete APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths: ['.github/workflows/build-found-apk.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private FOUND source
        uses: actions/checkout@v4
        with:
          repository: misterscrappy/FOUND
          ref: 8f2b160cfe1aa1a8dbf9941f107b91786dd56e61
          token: ${{ secrets.FOUND_PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact forward source
        working-directory: source
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "8f2b160cfe1aa1a8dbf9941f107b91786dd56e61"
          grep -Fq 'versionCode 84' app/build.gradle
          grep -Fq "versionName '3.2.18'" app/build.gradle

          for f in \
            app/src/main/assets/js/runtime/pending-list-19-30.js \
            app/src/main/assets/js/runtime/stamp-surface-integrity-v4.js \
            app/src/main/assets/js/runtime/stamp-autospin-tuning.js \
            app/src/main/assets/js/runtime/splash-3s-guard.js \
            app/src/main/assets/js/runtime/progression-reward-integrity.js \
            app/src/main/assets/js/ui/collector-render-stability-guard.js \
            app/src/main/assets/js/ui/profile-showcase-stable.js \
            app/src/main/assets/js/ui/market-listing-provenance.js \
            app/src/main/assets/js/ui/provenance-cancel-filter.js \
            app/src/main/assets/js/ui/admin-return-circulation.js \
            app/src/main/assets/js/ui/postal-my-stamps-preview.js \
            app/src/main/assets/js/ui/settings-order-polish.js \
            app/src/main/assets/js/ui/watch-market-confirmation.js \
            app/src/main/assets/js/ui/postal-search-button-sizing.js \
            app/src/main/assets/js/ui/field-map-footer-layout.js \
            app/src/main/assets/js/ui/support-center.js \
            app/src/main/assets/js/ui/collector-page-router.js \
            app/src/main/assets/js/ui/collector-page-tab-cleanup.js \
            app/src/main/assets/js/ui/collector-page-tab-routing.js \
            database/found_v3216_return_to_circulation.sql \
            database/found_v3217_support_rewards_provenance.sql \
            database/found_v3217_progression_reward_sync.sql \
            database/found_v320_z_allow_single_copy_stamp_transfers.sql; do test -f "$f"; done

          for f in \
            app/src/main/assets/js/runtime/progression-reward-integrity.js \
            app/src/main/assets/js/ui/support-center.js \
            app/src/main/assets/js/ui/field-map-footer-layout.js \
            app/src/main/assets/js/ui/provenance-cancel-filter.js \
            app/src/main/assets/js/ui/collector-page-router.js \
            app/src/main/assets/js/ui/collector-page-tab-cleanup.js \
            app/src/main/assets/js/ui/collector-page-tab-routing.js \
            app/src/main/assets/js/runtime/approved.js; do node --check "$f"; done

          grep -Fq '__FOUND_SUPPORT_CENTER_V1__' app/src/main/assets/js/ui/support-center.js
          grep -Fq 'REPORT A PROBLEM' app/src/main/assets/js/ui/support-center.js
          grep -Fq 'MY REPORTS' app/src/main/assets/js/ui/support-center.js
          grep -Fq 'PLAYER REPORTS' app/src/main/assets/js/ui/support-center.js
          grep -Fq 'RECENT CLIENT ERRORS' app/src/main/assets/js/ui/support-center.js
          grep -Fq 'SUBMITTED' app/src/main/assets/js/ui/support-center.js
          grep -Fq 'REVIEWING' app/src/main/assets/js/ui/support-center.js
          grep -Fq 'RESOLVED' app/src/main/assets/js/ui/support-center.js
          grep -Fq 'COLLECTOR DETAILS' app/src/main/assets/js/ui/support-center.js
          grep -Fq 'Add a short collector bio.' app/src/main/assets/js/ui/support-center.js
          grep -Fq 'save.textContent = "SAVE"' app/src/main/assets/js/ui/support-center.js
          grep -Fq 'client_version:"3.2.18"' app/src/main/assets/js/ui/support-center.js
          grep -Fq 'recent_client_errors' app/src/main/assets/js/ui/support-center.js

          grep -Fq '__FOUND_FIELD_MAP_FOOTER_LAYOUT_V1__' app/src/main/assets/js/ui/field-map-footer-layout.js
          grep -Fq 'TAP A STATE TO OPEN ITS FIELD MAP' app/src/main/assets/js/ui/field-map-footer-layout.js
          grep -Fq 'DRAG • PINCH • ZOOM' app/src/main/assets/js/ui/field-map-footer-layout.js
          grep -Fq 'NOT TO SCALE - LOCATIONS NOT GEOGRAPHICALLY ACCURATE' app/src/main/assets/js/ui/field-map-footer-layout.js
          grep -Fq 'TAP THE LIVE DESTINATION ZONES NUMBERED ON THE FIELD MAP' app/src/main/assets/js/ui/field-map-footer-layout.js
          grep -Fq 'Original digital souvenirs • Not valid postage • Not issued or endorsed by a postal authority' app/src/main/assets/js/ui/field-map-footer-layout.js
          grep -Fq '#exploreStateView #stateMapLegend{left:10px!important;right:auto!important;top:9px!important;bottom:auto!important;text-align:left!important}' app/src/main/assets/js/ui/field-map-footer-layout.js
          ! grep -Fq 'max-width:72%!important' app/src/main/assets/js/ui/field-map-footer-layout.js
          ! grep -Fq 'max-width:74%!important' app/src/main/assets/js/ui/field-map-footer-layout.js
          grep -Fq '#exchangePanel > .foundPostalExchangeLegal{min-height:0!important;margin:0!important;display:block!important;padding:0!important;text-align:center!important;font-size:7px!important;line-height:1.15!important;white-space:nowrap!important}' app/src/main/assets/js/ui/field-map-footer-layout.js

          grep -Fq '__FOUND_PROGRESSION_REWARD_INTEGRITY_V1__' app/src/main/assets/js/runtime/progression-reward-integrity.js
          grep -Fq 'ack_progression_reward_baseline' app/src/main/assets/js/runtime/progression-reward-integrity.js
          grep -Fq '+15 XP' app/src/main/assets/js/runtime/progression-reward-integrity.js
          grep -Fq 'claim_weekly_objective' app/src/main/assets/js/runtime/progression-reward-integrity.js
          grep -Fq 'claim_achievement' app/src/main/assets/js/runtime/progression-reward-integrity.js

          grep -Fq '"LISTED"' app/src/main/assets/js/ui/provenance-cancel-filter.js
          grep -Fq 'LISTING REMOVED' app/src/main/assets/js/ui/provenance-cancel-filter.js
          grep -Fq "e.event_type not in ('listed','listing_cancelled','listing_canceled','listing_removed')" database/found_v3217_support_rewards_provenance.sql
          grep -Fq 'submit_support_report' database/found_v3217_support_rewards_provenance.sql
          grep -Fq 'get_my_support_reports' database/found_v3217_support_rewards_provenance.sql
          grep -Fq 'admin_get_support_reports' database/found_v3217_support_rewards_provenance.sql
          grep -Fq 'admin_update_support_report_status' database/found_v3217_support_rewards_provenance.sql
          grep -Fq 'ack_progression_reward_baseline' database/found_v3217_progression_reward_sync.sql
          grep -Fq 'Do not advance last_client_coins here' database/found_v3217_progression_reward_sync.sql
          grep -Fq 'XP is never spent' database/found_v3217_progression_reward_sync.sql
          grep -Fq 'select count(*)::integer' database/found_v320_z_allow_single_copy_stamp_transfers.sql

          grep -Fq '"support", "admin"' app/src/main/assets/js/ui/collector-page-router.js
          grep -Fq 'data-found-tab="support"' app/src/main/assets/js/ui/collector-page-tab-cleanup.js
          grep -Fq '"support", "admin"' app/src/main/assets/js/ui/collector-page-tab-routing.js

          for marker in \
            'field-map-footer-layout.js' \
            'progression-reward-integrity.js' \
            'support-center.js' \
            'provenance-cancel-filter.js' \
            'admin-return-circulation.js' \
            'postal-my-stamps-preview.js' \
            'settings-order-polish.js' \
            'stamp-surface-integrity-v4.js' \
            'collector-render-stability-guard.js' \
            'profile-showcase-stable.js' \
            'market-listing-provenance.js' \
            'watch-market-confirmation.js' \
            'postal-search-button-sizing.js'; do grep -Fq "$marker" app/src/main/assets/js/runtime/approved.js; done

          grep -Fq 'admin_return_limited_to_circulation' database/found_v3216_return_to_circulation.sql
          grep -Fq "'circulation_pool',true" database/found_v3216_return_to_circulation.sql
          grep -Fq "source='circulation_reissue'" database/found_v3216_return_to_circulation.sql
          grep -Fq '__foundAutoSpinTimeBasedV2' app/src/main/assets/js/runtime/stamp-autospin-tuning.js
          grep -Fq 'MIN_SPLASH_MS = 3000' app/src/main/assets/js/runtime/splash-3s-guard.js

          ! grep -Fq 'src="js/runtime/stamp-surface-integrity.js"' app/src/main/assets/js/runtime/approved.js
          ! grep -Fq 'settings-popup-controller.js' app/src/main/assets/js/runtime/approved.js
          ! grep -Fq 'profile-showcase-editor.js' app/src/main/assets/js/runtime/approved.js
          ! grep -Fq 'profile-showcase-owned-fallback.js' app/src/main/assets/js/runtime/approved.js
          ! grep -Fq 'android-safe-album-inspector.js' app/src/main/assets/js/runtime/approved.js
          ! grep -Fq 'album-detail-open-guard.js' app/src/main/assets/js/runtime/approved.js

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore and verify signing key
        working-directory: source
        run: |
          base64 --decode .github/signing/found-alpha-debug.keystore.b64 > .github/signing/found-alpha-debug.keystore
          chmod 600 .github/signing/found-alpha-debug.keystore
          FINGERPRINT="$(keytool -list -v -keystore .github/signing/found-alpha-debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | head -n1)"
          test "$FINGERPRINT" = "678E0BF28B640EC68C9103DBC1ED33946ECB32D6AA8B16F3CD2A6ACDA459247E"

      - name: Build complete APK
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify packaged APK
        working-directory: source
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK"
          for f in \
            assets/js/runtime/pending-list-19-30.js \
            assets/js/runtime/stamp-surface-integrity-v4.js \
            assets/js/runtime/stamp-autospin-tuning.js \
            assets/js/runtime/splash-3s-guard.js \
            assets/js/runtime/progression-reward-integrity.js \
            assets/js/ui/support-center.js \
            assets/js/ui/field-map-footer-layout.js \
            assets/js/ui/provenance-cancel-filter.js \
            assets/js/ui/admin-return-circulation.js \
            assets/js/ui/postal-my-stamps-preview.js \
            assets/js/ui/settings-order-polish.js \
            assets/js/ui/market-listing-provenance.js \
            assets/js/ui/watch-market-confirmation.js \
            assets/js/ui/profile-showcase-stable.js; do unzip -l "$APK" | grep -F "$f"; done

          unzip -p "$APK" assets/js/ui/support-center.js | grep -Fq '__FOUND_SUPPORT_CENTER_V1__'
          unzip -p "$APK" assets/js/ui/support-center.js | grep -Fq 'client_version:"3.2.18"'
          unzip -p "$APK" assets/js/ui/support-center.js | grep -Fq 'MY REPORTS'
          unzip -p "$APK" assets/js/ui/support-center.js | grep -Fq 'PLAYER REPORTS'
          unzip -p "$APK" assets/js/ui/field-map-footer-layout.js | grep -Fq 'NOT TO SCALE - LOCATIONS NOT GEOGRAPHICALLY ACCURATE'
          unzip -p "$APK" assets/js/ui/field-map-footer-layout.js | grep -Fq 'DRAG • PINCH • ZOOM'
          unzip -p "$APK" assets/js/ui/field-map-footer-layout.js | grep -Fq '#exploreStateView #stateMapLegend{left:10px!important;right:auto!important;top:9px!important;bottom:auto!important;text-align:left!important}'
          ! unzip -p "$APK" assets/js/ui/field-map-footer-layout.js | grep -Fq 'max-width:72%!important'
          ! unzip -p "$APK" assets/js/ui/field-map-footer-layout.js | grep -Fq 'max-width:74%!important'
          unzip -p "$APK" assets/js/ui/field-map-footer-layout.js | grep -Fq '#exchangePanel > .foundPostalExchangeLegal{min-height:0!important;margin:0!important;display:block!important;padding:0!important;text-align:center!important;font-size:7px!important;line-height:1.15!important;white-space:nowrap!important}'
          unzip -p "$APK" assets/js/runtime/progression-reward-integrity.js | grep -Fq 'ack_progression_reward_baseline'
          unzip -p "$APK" assets/js/ui/provenance-cancel-filter.js | grep -Fq '"LISTED"'
          unzip -p "$APK" assets/js/ui/admin-return-circulation.js | grep -Fq 'admin_return_limited_to_circulation'
          unzip -p "$APK" assets/js/ui/postal-my-stamps-preview.js | grep -Fq 'foundStampPreview19'
          unzip -p "$APK" assets/js/ui/settings-order-polish.js | grep -Fq 'foundSettingsAccountSaveCompact'
          unzip -p "$APK" assets/js/runtime/stamp-autospin-tuning.js | grep -Fq '__foundAutoSpinTimeBasedV2'
          unzip -p "$APK" assets/js/runtime/splash-3s-guard.js | grep -Fq 'MIN_SPLASH_MS = 3000'
          for marker in field-map-footer-layout.js progression-reward-integrity.js support-center.js provenance-cancel-filter.js admin-return-circulation.js postal-my-stamps-preview.js settings-order-polish.js stamp-surface-integrity-v4.js; do unzip -p "$APK" assets/js/runtime/approved.js | grep -Fq "$marker"; done
          ! unzip -p "$APK" assets/js/runtime/approved.js | grep -Fq 'src="js/runtime/stamp-surface-integrity.js"'
          ! unzip -p "$APK" assets/js/runtime/approved.js | grep -Fq 'settings-popup-controller.js'

      - name: Verify signing certificate
        working-directory: source
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          CERT_OUT="$($APKSIGNER verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk 2>&1)"
          printf '%s\n' "$CERT_OUT"
          CERT_SHA="$(printf '%s\n' "$CERT_OUT" | grep -i -m1 'certificate.*sha-256.*digest' | sed -E 's/.*:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$CERT_SHA" = "678E0BF28B640EC68C9103DBC1ED33946ECB32D6AA8B16F3CD2A6ACDA459247E"

      - name: Package APK
        run: |
          cp source/app/build/outputs/apk/debug/app-debug.apk FOUND-v3.2.18-COMPLETE.apk
          sha256sum FOUND-v3.2.18-COMPLETE.apk

      - name: Upload complete APK
        uses: actions/upload-artifact@v4
        with:
          name: FOUND-v3.2.18-COMPLETE-APK
          path: FOUND-v3.2.18-COMPLETE.apk
          if-no-files-found: error
          retention-days: 30
