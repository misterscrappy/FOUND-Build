name: Build FOUND Complete APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths: ['.github/workflows/build-found-apk.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private FOUND source
        uses: actions/checkout@v4
        with:
          repository: misterscrappy/FOUND
          ref: b4ce0bd02b4f5784e9d4f455f0e56de49faebf1b
          token: ${{ secrets.FOUND_PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact forward source
        working-directory: source
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "b4ce0bd02b4f5784e9d4f455f0e56de49faebf1b"
          grep -Fq 'versionCode 80' app/build.gradle
          grep -Fq "versionName '3.2.14'" app/build.gradle

          for f in \
            app/src/main/assets/js/runtime/pending-list-19-30.js \
            app/src/main/assets/js/runtime/base-alpha-forward.js \
            app/src/main/assets/js/runtime/post-office-mailbox-sales.js \
            app/src/main/assets/js/runtime/collector-detail-loop-guard.js \
            app/src/main/assets/js/runtime/webgl-stamp-alpha-smoothing.js \
            app/src/main/assets/js/runtime/stamp-detail-performance.js \
            app/src/main/assets/js/runtime/stamp-autospin-tuning.js \
            app/src/main/assets/js/runtime/stamp-surface-integrity-v4.js \
            app/src/main/assets/js/ui/collector-render-stability-guard.js \
            app/src/main/assets/js/ui/collector-page-scroll-fix.js \
            app/src/main/assets/js/ui/collector-page-tab-routing.js \
            app/src/main/assets/js/ui/profile-showcase-stable.js \
            app/src/main/assets/js/ui/postal-exchange-gold-filter.js \
            app/src/main/assets/js/ui/postal-exchange-utility-navigation-v2.js \
            app/src/main/assets/js/ui/postal-exchange-flow-polish.js \
            app/src/main/assets/js/ui/market-listing-detail.js \
            app/src/main/assets/js/ui/market-listing-forward-actions.js \
            app/src/main/assets/js/ui/provenance-presentation-polish.js \
            database/found_v3211_showcase_collectibles_execute.sql; do test -f "$f"; done

          node --check app/src/main/assets/js/runtime/stamp-surface-integrity-v4.js
          node --check app/src/main/assets/js/ui/collector-render-stability-guard.js
          node --check app/src/main/assets/js/ui/collector-page-scroll-fix.js
          node --check app/src/main/assets/js/ui/profile-showcase-stable.js
          node --check app/src/main/assets/js/ui/postal-exchange-flow-polish.js

          grep -Fq '__foundSurfaceIntegrityV4' app/src/main/assets/js/runtime/stamp-surface-integrity-v4.js
          grep -Fq 'stablePerforatedBody' app/src/main/assets/js/runtime/stamp-surface-integrity-v4.js
          grep -Fq 'addRimSequence' app/src/main/assets/js/runtime/stamp-surface-integrity-v4.js
          grep -Fq 'addOuterWalls' app/src/main/assets/js/runtime/stamp-surface-integrity-v4.js
          grep -Fq 'indices: [0,1,2, 0,2,3]' app/src/main/assets/js/runtime/stamp-surface-integrity-v4.js

          grep -Fq '__FOUND_COLLECTOR_RENDER_STABILITY_GUARD__' app/src/main/assets/js/ui/collector-render-stability-guard.js
          grep -Fq 'preserveY' app/src/main/assets/js/ui/collector-render-stability-guard.js
          grep -Fq 'movingCollectorIntoPost' app/src/main/assets/js/ui/collector-render-stability-guard.js
          grep -Fq 'overflow-y:scroll!important' app/src/main/assets/js/ui/collector-page-scroll-fix.js
          grep -Fq -- '-webkit-overflow-scrolling:touch!important' app/src/main/assets/js/ui/collector-page-scroll-fix.js
          grep -Fq 'touch-action:pan-y!important' app/src/main/assets/js/ui/collector-page-scroll-fix.js
          grep -Fq 'foundStableShowcaseStyle' app/src/main/assets/js/ui/profile-showcase-stable.js
          ! grep -Fq 'toDataURL' app/src/main/assets/js/ui/profile-showcase-stable.js
          ! grep -Fq 'FoundObject3D' app/src/main/assets/js/ui/profile-showcase-stable.js

          grep -Fq '__FOUND_POSTAL_EXCHANGE_FLOW_POLISH__' app/src/main/assets/js/ui/postal-exchange-flow-polish.js
          grep -Fq 'foundPostalUtilityV2Heading' app/src/main/assets/js/ui/postal-exchange-flow-polish.js
          grep -Fq 'remove();' app/src/main/assets/js/ui/postal-exchange-flow-polish.js
          grep -Fq 'grid-template-columns:1fr 1.25fr .75fr!important' app/src/main/assets/js/ui/postal-exchange-flow-polish.js
          grep -Fq 'min-height:30px!important' app/src/main/assets/js/ui/postal-exchange-flow-polish.js
          grep -Fq 'overflow:visible!important' app/src/main/assets/js/ui/postal-exchange-flow-polish.js
          grep -Fq 'notice.insertAdjacentElement("afterend", host)' app/src/main/assets/js/ui/postal-exchange-flow-polish.js
          grep -Fq 'host.insertAdjacentElement("afterend", hub)' app/src/main/assets/js/ui/postal-exchange-flow-polish.js
          grep -Fq 'ADVANCED POSTAL SEARCH' app/src/main/assets/js/ui/postal-exchange-utility-navigation-v2.js
          grep -Fq '>WATCHLIST<' app/src/main/assets/js/ui/postal-exchange-utility-navigation-v2.js
          grep -Fq '>RECENT SALES<' app/src/main/assets/js/ui/postal-exchange-utility-navigation-v2.js

          grep -Fq 'stamp-surface-integrity-v4.js' app/src/main/assets/js/runtime/approved.js
          grep -Fq 'collector-render-stability-guard.js' app/src/main/assets/js/runtime/approved.js
          grep -Fq 'postal-exchange-utility-navigation-v2.js' app/src/main/assets/js/runtime/approved.js
          grep -Fq 'postal-exchange-flow-polish.js' app/src/main/assets/js/runtime/approved.js
          grep -Fq 'collector-page-scroll-fix.js' app/src/main/assets/js/runtime/approved.js
          grep -Fq 'profile-showcase-stable.js' app/src/main/assets/js/runtime/approved.js
          ! grep -Fq 'src="js/runtime/stamp-surface-integrity.js"' app/src/main/assets/js/runtime/approved.js
          ! grep -Fq 'profile-showcase-editor.js' app/src/main/assets/js/runtime/approved.js
          ! grep -Fq 'profile-showcase-owned-fallback.js' app/src/main/assets/js/runtime/approved.js
          ! grep -Fq 'settings-popup-controller.js' app/src/main/assets/js/runtime/approved.js
          ! grep -Fq 'android-safe-album-inspector.js' app/src/main/assets/js/runtime/approved.js
          ! grep -Fq 'album-detail-open-guard.js' app/src/main/assets/js/runtime/approved.js

          grep -Fq 'Gold Foil' app/src/main/assets/js/ui/postal-exchange-gold-filter.js
          grep -Fq 'VERIFIED ORIGIN' app/src/main/assets/js/ui/provenance-presentation-polish.js
          grep -Fq 'grant execute on function public.get_my_collectibles() to authenticated' database/found_v3211_showcase_collectibles_execute.sql

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore and verify signing key
        working-directory: source
        run: |
          base64 --decode .github/signing/found-alpha-debug.keystore.b64 > .github/signing/found-alpha-debug.keystore
          chmod 600 .github/signing/found-alpha-debug.keystore
          FINGERPRINT="$(keytool -list -v -keystore .github/signing/found-alpha-debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | head -n1)"
          test "$FINGERPRINT" = "678E0BF28B640EC68C9103DBC1ED33946ECB32D6AA8B16F3CD2A6ACDA459247E"

      - name: Build complete APK
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify packaged APK
        working-directory: source
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK"
          for f in \
            assets/js/runtime/pending-list-19-30.js \
            assets/js/runtime/stamp-surface-integrity-v4.js \
            assets/js/ui/collector-render-stability-guard.js \
            assets/js/ui/collector-page-scroll-fix.js \
            assets/js/ui/profile-showcase-stable.js \
            assets/js/ui/postal-exchange-utility-navigation-v2.js \
            assets/js/ui/postal-exchange-flow-polish.js \
            assets/js/ui/postal-exchange-gold-filter.js \
            assets/js/ui/provenance-presentation-polish.js; do unzip -l "$APK" | grep -F "$f"; done

          unzip -p "$APK" assets/js/runtime/stamp-surface-integrity-v4.js | grep -Fq '__foundSurfaceIntegrityV4'
          unzip -p "$APK" assets/js/runtime/stamp-surface-integrity-v4.js | grep -Fq 'stablePerforatedBody'
          unzip -p "$APK" assets/js/ui/collector-render-stability-guard.js | grep -Fq 'movingCollectorIntoPost'
          unzip -p "$APK" assets/js/ui/collector-page-scroll-fix.js | grep -Fq 'overflow-y:scroll!important'
          unzip -p "$APK" assets/js/ui/profile-showcase-stable.js | grep -Fq 'foundStableShowcaseStyle'
          ! unzip -p "$APK" assets/js/ui/profile-showcase-stable.js | grep -Fq 'toDataURL'
          unzip -p "$APK" assets/js/ui/postal-exchange-flow-polish.js | grep -Fq 'notice.insertAdjacentElement("afterend", host)'
          unzip -p "$APK" assets/js/ui/postal-exchange-flow-polish.js | grep -Fq 'grid-template-columns:1fr 1.25fr .75fr!important'
          unzip -p "$APK" assets/js/ui/postal-exchange-flow-polish.js | grep -Fq 'overflow:visible!important'
          unzip -p "$APK" assets/js/runtime/approved.js | grep -Fq 'stamp-surface-integrity-v4.js'
          unzip -p "$APK" assets/js/runtime/approved.js | grep -Fq 'collector-render-stability-guard.js'
          unzip -p "$APK" assets/js/runtime/approved.js | grep -Fq 'postal-exchange-flow-polish.js'
          ! unzip -p "$APK" assets/js/runtime/approved.js | grep -Fq 'src="js/runtime/stamp-surface-integrity.js"'
          ! unzip -p "$APK" assets/js/runtime/approved.js | grep -Fq 'profile-showcase-editor.js'

      - name: Verify signing certificate
        working-directory: source
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          CERT_OUT="$($APKSIGNER verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk 2>&1)"
          printf '%s\n' "$CERT_OUT"
          CERT_SHA="$(printf '%s\n' "$CERT_OUT" | grep -i -m1 'certificate.*sha-256.*digest' | sed -E 's/.*:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$CERT_SHA" = "678E0BF28B640EC68C9103DBC1ED33946ECB32D6AA8B16F3CD2A6ACDA459247E"

      - name: Package APK
        run: |
          cp source/app/build/outputs/apk/debug/app-debug.apk FOUND-v3.2.14-COMPLETE.apk
          sha256sum FOUND-v3.2.14-COMPLETE.apk

      - name: Upload complete APK
        uses: actions/upload-artifact@v4
        with:
          name: FOUND-v3.2.14-COMPLETE-APK
          path: FOUND-v3.2.14-COMPLETE.apk
          if-no-files-found: error
          retention-days: 30
