name: Publish FOUND v3.2.81 direct APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3281-direct.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public build repo
        uses: actions/checkout@v4

      - name: Verify v3.2.81 APK
        run: |
          set -euo pipefail
          APK='downloads/FOUND-v3.2.81-full-game.apk'
          EXPECTED='3e209c795f8e93c5d481b91403fbaaf102cded546e27f1530d089b05b64608d8'
          test -s "$APK"
          ACTUAL="$(sha256sum "$APK" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload v3.2.81 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOUND-v3.2.81-full-game-APK
          path: downloads/FOUND-v3.2.81-full-game.apk
          if-no-files-found: error
          retention-days: 30
