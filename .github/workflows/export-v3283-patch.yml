name: Export FOUND v3.2.83 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-v3283-patch.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4

      - name: Checkout private FOUND
        uses: actions/checkout@v4
        with:
          repository: misterscrappy/FOUND
          ref: main
          token: ${{ secrets.FOUND_PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Reconstruct and verify compact patch
        run: |
          set -euo pipefail
          tr -d '\n' < source/builds/v3283-delta/patch.lines | base64 -d > v3283.bsdiff
          test "$(sha256sum v3283.bsdiff | awk '{print $1}')" = '26b7506feb50cdcefd625ffe6c3e63b42635bf89dede327c7b1d419f573267ff'
          test "$(stat -c%s v3283.bsdiff)" = '47749'

      - name: Upload compact patch
        uses: actions/upload-artifact@v4
        with:
          name: FOUND-v3.2.83-private-delta
          path: v3283.bsdiff
          if-no-files-found: error
          retention-days: 1
