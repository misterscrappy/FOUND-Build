name: Export FOUND v3.2.86 private delta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-v3286-delta.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4

      - name: Checkout private FOUND
        uses: actions/checkout@v4
        with:
          repository: misterscrappy/FOUND
          ref: main
          token: ${{ secrets.FOUND_PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Build and verify compact v3.2.85 to v3.2.86 patch
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bsdiff
          BASE='source/builds/FOUND-v3.2.85-full-game.apk'
          TARGET='source/builds/FOUND-v3.2.86-full-game.apk'
          test "$(sha256sum "$BASE" | awk '{print $1}')" = 'cb9fdeecaf165913f9a2ec66bd1cc8173fca40b1215b8fb4f6fd148a90cdaa5a'
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = '555b861b34f29d0c435596984d26a55343895741d7c69130780346d1e73c6434'
          bsdiff "$BASE" "$TARGET" v3286.bsdiff
          bspatch "$BASE" reconstructed.apk v3286.bsdiff
          test "$(sha256sum reconstructed.apk | awk '{print $1}')" = '555b861b34f29d0c435596984d26a55343895741d7c69130780346d1e73c6434'
          sha256sum v3286.bsdiff > v3286.bsdiff.sha256

      - name: Upload compact patch only
        uses: actions/upload-artifact@v4
        with:
          name: FOUND-v3.2.86-private-delta
          path: |
            v3286.bsdiff
            v3286.bsdiff.sha256
          if-no-files-found: error
          retention-days: 1
