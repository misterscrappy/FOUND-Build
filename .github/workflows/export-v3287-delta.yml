name: Export FOUND v3.2.87 private delta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-v3287-delta.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4

      - name: Checkout private FOUND
        uses: actions/checkout@v4
        with:
          repository: misterscrappy/FOUND
          ref: main
          token: ${{ secrets.FOUND_PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Build and verify compact v3.2.86 to v3.2.87 patch
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bsdiff
          BASE='source/builds/FOUND-v3.2.86-full-game.apk'
          TARGET='source/builds/FOUND-v3.2.87-full-game.apk'
          test "$(sha256sum "$BASE" | awk '{print $1}')" = '555b861b34f29d0c435596984d26a55343895741d7c69130780346d1e73c6434'
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = '09c503411abcd2713610dbeea56812e27552ba15d48d6c00ca2d3983d4b60a10'
          bsdiff "$BASE" "$TARGET" v3287.bsdiff
          bspatch "$BASE" reconstructed.apk v3287.bsdiff
          test "$(sha256sum reconstructed.apk | awk '{print $1}')" = '09c503411abcd2713610dbeea56812e27552ba15d48d6c00ca2d3983d4b60a10'
          sha256sum v3287.bsdiff > v3287.bsdiff.sha256

      - name: Upload compact patch only
        uses: actions/upload-artifact@v4
        with:
          name: FOUND-v3.2.87-private-delta
          path: |
            v3287.bsdiff
            v3287.bsdiff.sha256
          if-no-files-found: error
          retention-days: 1
