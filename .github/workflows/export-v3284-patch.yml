name: Export FOUND v3.2.84 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-v3284-patch.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4

      - name: Checkout private FOUND
        uses: actions/checkout@v4
        with:
          repository: misterscrappy/FOUND
          ref: main
          token: ${{ secrets.FOUND_PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Build and verify compact v3.2.83 to v3.2.84 patch
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bsdiff
          BASE='source/builds/FOUND-v3.2.83-full-game.apk'
          TARGET='source/builds/FOUND-v3.2.84-full-game.apk'
          test "$(sha256sum "$BASE" | awk '{print $1}')" = '0f0ac05cc3955db7d40c5646457cdcba0f4caf878d69830ee442dcc5d0ca3d48'
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = 'b4a2f0e1c08afb63e14da2192bb3a6ba07c119f04dd146e03f5bec93bc6c07d8'
          bsdiff "$BASE" "$TARGET" v3284.bsdiff
          bspatch "$BASE" reconstructed.apk v3284.bsdiff
          test "$(sha256sum reconstructed.apk | awk '{print $1}')" = 'b4a2f0e1c08afb63e14da2192bb3a6ba07c119f04dd146e03f5bec93bc6c07d8'
          sha256sum v3284.bsdiff > v3284.bsdiff.sha256
          stat -c '%s' v3284.bsdiff > v3284.bsdiff.size

      - name: Upload compact patch only
        uses: actions/upload-artifact@v4
        with:
          name: FOUND-v3.2.84-private-delta
          path: |
            v3284.bsdiff
            v3284.bsdiff.sha256
            v3284.bsdiff.size
          if-no-files-found: error
          retention-days: 1
