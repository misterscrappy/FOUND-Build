name: Build GDevelop project

on:
  push:
    branches: [main]
    paths:
      - 'gdevelop-source/**'
      - 'scripts/gdevelop-patch-boot.mjs'
      - 'scripts/gdevelop-patch-explore.mjs'
      - '.github/workflows/build-gdevelop-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild game.json
        shell: bash
        run: |
          set -euo pipefail
          cat gdevelop-source/v2/part* > /tmp/found-gdevelop.b64
          test "$(wc -c < /tmp/found-gdevelop.b64)" -eq 12452
          echo "156f7d56a2c164cddb5d255f783ba5918cac5743a5efa3cdcbc10e59002bacf3  /tmp/found-gdevelop.b64" | sha256sum -c -
          base64 --decode /tmp/found-gdevelop.b64 | gzip --decompress > game.json
          node scripts/gdevelop-patch-boot.mjs game.json
          node scripts/gdevelop-patch-explore.mjs game.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('game.json','utf8')); console.log('FOUND GDevelop', p.properties.version, p.layouts.map(x=>x.name).join(', '));"

      - name: Commit generated project
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- game.json; then
            echo 'game.json already current.'
            exit 0
          fi
          git config user.name 'FOUND GDevelop Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add game.json
          git commit -m 'Build GDevelop project from source'
          git push
