name: Publish FOUND v3.2.82 direct APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3282-direct.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public build repo
        uses: actions/checkout@v4

      - name: Checkout verified FOUND build
        uses: actions/checkout@v4
        with:
          repository: misterscrappy/FOUND
          ref: main
          token: ${{ secrets.FOUND_PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify v3.2.82 APK
        run: |
          set -euo pipefail
          SRC='source/builds/FOUND-v3.2.82-full-game.apk'
          OUT='FOUND-v3.2.82-full-game.apk'
          EXPECTED='bd836576acf2c995296b75cf4e0b65ceef34e6efbc1f6e37a8a8bff781054985'
          test -s "$SRC"
          ACTUAL="$(sha256sum "$SRC" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          cp "$SRC" "$OUT"

      - name: Upload v3.2.82 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOUND-v3.2.82-full-game-APK
          path: FOUND-v3.2.82-full-game.apk
          if-no-files-found: error
          retention-days: 30
