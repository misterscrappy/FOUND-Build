name: Publish FOUND v3.2.82 direct APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3282-direct.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public build repo
        uses: actions/checkout@v4

      - name: Download and verify v3.2.82 APK
        run: |
          set -euo pipefail
          URL='https://eghcznzabgbkrhahdqej.supabase.co/storage/v1/object/public/found-builds/v3.2.82/FOUND-v3.2.82-full-game.apk'
          OUT='FOUND-v3.2.82-full-game.apk'
          EXPECTED='bd836576acf2c995296b75cf4e0b65ceef34e6efbc1f6e37a8a8bff781054985'
          curl --fail --location --retry 3 --output "$OUT" "$URL"
          ACTUAL="$(sha256sum "$OUT" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload v3.2.82 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOUND-v3.2.82-full-game-APK
          path: FOUND-v3.2.82-full-game.apk
          if-no-files-found: error
          retention-days: 30
